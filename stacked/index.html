(function(){
"use strict";
const HOST="https://stacked-cyd.vercel.app";
const q=document.getElementById("q"),grid=document.getElementById("grid"),filters=document.getElementById("filters"),heading=document.getElementById("heading"),results=document.getElementById("results"),empty=document.getElementById("empty"),featured=document.getElementById("featured");

function slug(id){return HOST+"/games/"+encodeURIComponent(id)+"/"}
function art(img){return img||""}
function fallback(img,title){
 if(!img){const x=document.createElement("div");x.className="fallback";x.textContent=title;return x}
 const el=document.createElement("img");el.loading="lazy";el.decoding="async";el.src=img;el.alt=title;
 el.addEventListener("error",()=>{el.hidden=true;const f=document.createElement("div");f.className="fallback";f.textContent=title;el.parentElement.appendChild(f)},{once:true});return el;
}
function card(g){
 const a=document.createElement("article");a.className="card";
 const poster=document.createElement("a");poster.className="poster";poster.href=slug(g.id);poster.setAttribute("aria-label","Play "+g.name);poster.appendChild(fallback(art(g.image),g.name));
 if(g.kind==="Online"){const badge=document.createElement("span");badge.className="online-badge";badge.textContent="ONLINE";poster.appendChild(badge)}
 const meta=document.createElement("div");meta.className="meta";
 const texts=document.createElement("div");texts.style.minWidth="0";
 const title=document.createElement("a");title.className="title";title.href=slug(g.id);title.textContent=g.name;title.title=g.name;
 const type=document.createElement("span");type.className="type";type.textContent=g.kind;
 texts.appendChild(title);texts.appendChild(type);
 const star=document.createElement("button");star.type="button";star.className="save";star.setAttribute("aria-label","Save "+g.name);star.setAttribute("aria-pressed",saved[g.id]?"true":"false");
 star.textContent=saved[g.id]?"★":"☆";
 star.addEventListener("click",()=>{saved[g.id]=!saved[g.id];localStorage.setItem("stacked_gh_saved",JSON.stringify(saved));star.textContent=saved[g.id]?"★":"☆";star.setAttribute("aria-pressed",saved[g.id]?"true":"false");if(active==="Saved")render()});
 meta.appendChild(texts);meta.appendChild(star);a.appendChild(poster);a.appendChild(meta);return a;
}
function render(){
 let shown=G.filter(g=>(active==="All"||active==="Saved"&&saved[g.id]||g.kind===active)&&(!query||(g.name+" "+g.kind).toLowerCase().includes(query)));
 grid.replaceChildren(...shown.map(card));
 results.textContent=shown.length+" OF "+G.length;
 heading.textContent=active==="All"?"All games":active==="Saved"?"Saved games":active+" games";
 empty.classList.toggle("visible",!shown.length);
 document.querySelectorAll(".chip").forEach(x=>{let is=x.dataset.filter===active;x.classList.toggle("active",is);x.setAttribute("aria-pressed",is?"true":"false")});
}
tabs.forEach(name=>{let b=document.createElement("button");b.type="button";b.className="chip";b.dataset.filter=name;b.textContent=name;b.addEventListener("click",()=>{active=name;render();});filters.appendChild(b)});
q.addEventListener("input",()=>{query=q.value.toLowerCase().trim();render()});
document.addEventListener("keydown",ev=>{if(ev.key==="/"&&document.activeElement!==q){ev.preventDefault();q.focus()}if(ev.key==="Escape"&&document.activeElement===q){q.blur()}});

const spotlight=["subway-surfers","madalin-stunt-cars-3","p2p-maze-shooter"];
for(const id of spotlight){let g=G.find(x=>x.id===id);if(!g)continue;

 if(g.image)a.appendChild(fallback(g.image,g.name));else {let f=document.createElement("div");f.className="fallback";f.textContent=g.name;a.appendChild(f)}

 let name=document.createElement("div");name.className="feature-title";name.textContent=g.name;
 let sub=document.createElement("div");sub.className="feature-sub";sub.textContent="PLAY GAME";text.appendChild(label);text.appendChild(name);text.appendChild(sub);a.appendChild(text);featured.appendChild(a);
}
const priority=["subway-surfers","drift-boss","run3","vex7","slope","p2p-maze-shooter","drop-zone","madalin-stunt-cars-3","basketball-stars"];
G.sort((a,b)=>{let aa=priority.indexOf(a.id),bb=priority.indexOf(b.id);if(aa===-1)aa=10000;if(bb===-1)bb=10000;return aa-bb||a.name.localeCompare(b.name)});
